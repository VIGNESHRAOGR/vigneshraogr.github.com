
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Vault | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111318;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #1c1f27;
            padding: 40px;
            width: 350px;
            border-radius: 15px;
            border: 1px solid #333;
            text-align: center;
        }

        .logo {
            color: #ff8c32;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            background: #111318;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #ff8c32;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f0ad69;
        }

        .footer {
            color: #777;
            font-size: 12px;
            margin-top: 25px;
        }

        .password-box {
            position: relative;
        }

        .passsword-box input {
            padding-right: 60px;
        }

        .password-box span {
            position: absolute;
            right: 15px;
            top: 13px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #ff8c32;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">VR VAULT</div>

        <p class="subtitle">Your Personal Cloud Storage</p>

        <form>
            <input type="text"
                   placeholder="Username"
                   required>

            <div class="password-box">
    <input type="password"
           id="password"
           placeholder="Password"
           required>

    <button type="button"
            onclick="document.getElementById('password').type =
            document.getElementById('password').type === 'password'
            ? 'text' : 'password'">
        Show
    </button>
</div>

            <button type="button" onclick="window.location.href='dashboard.html'">
                Login
            </button>
        </form>

        <p class="footer">
            Private Storage • Secure Access
        </p>

    </div>

    <script>
function togglePassword() {

    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>
</body>
</html>
